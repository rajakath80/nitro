[package]
name = "nitro"
version = "0.1.0"
edition = "2024"

[dependencies]
bs58 = "0.5.1"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hex = "0.4.3"
k256 = { version = "0.13.4", features = ["ecdsa","sha256"] }
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio = { version = "1.45.1", features = ["full"] }
tokio-vsock = "0.7.1"
